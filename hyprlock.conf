# Example for an input field
input-field {
  monitor =
  size = 200, 50
  outline_thickness = 3
  dots_size = 0.33
  dots_spacing = 0.15
  fade_on_empty = false
  placeholder_text = <i>Input Password...</i>
  font_color = rgb(10, 10, 10)
  position = 0, 0
  valign = center
  halign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 35
    font_family = Noto Sans
    position = 0, -80
    halign = center
    valign = center
}


label {
    monitor =
    color = rgba(255, 255, 255, 1.0)
    font_size = 12
    font_family = Noto Sans
    text = $LAYOUT
    position = 0, -130
    halign = center
    valign = center # Other label widget options...
}

